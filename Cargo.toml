bin = [{name = "hyper-vm-runtime", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-vm-runtime"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/vm-runtime"
publish = false
autotests = false
workspace = "../../app"

[dependencies]

[dependencies.hyper-os]
workspace = true
features = ["std"]

[dependencies.hyper-rt]
workspace = true
features = ["std"]

[dependencies.hyper-service]
workspace = true

[dependencies.hyper-vm-image]
workspace = true

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]

[features]
startup-profile = []
broker-test = []
test-runtime-crash = []
test-power-crash = []

[target]

[target."cfg(target_os = \"hyper\")"]

[target."cfg(target_os = \"hyper\")".dependencies]

[target."cfg(target_os = \"hyper\")".dependencies.hyper-vm-policy-shared]
workspace = true

[target."cfg(target_os = \"hyper\")".dependencies.hyper-vm-support-shared]
workspace = true

[target."cfg(not(target_os = \"hyper\"))"]

[target."cfg(not(target_os = \"hyper\"))".dependencies]

[target."cfg(not(target_os = \"hyper\"))".dependencies.hyper-vm-policy]
workspace = true

[target."cfg(not(target_os = \"hyper\"))".dependencies.hyper-vm-support]
workspace = true
